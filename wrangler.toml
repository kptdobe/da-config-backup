name = "da-config-backup"
main = "src/index.js"
compatibility_date = "2024-01-01"

[observability]
enabled = true

[triggers]
crons = [
  "0 6 * * *",     # daily: start a new backup session
  "*/10 * * * *",  # every 10 min: continue an active session until all keys are processed
]

[[kv_namespaces]]
binding = "DA_CONFIG"
id = "a20824737cd8499bae0f0d887ac6db21"
# remote = true

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "aem-config-backup"
# remote = true